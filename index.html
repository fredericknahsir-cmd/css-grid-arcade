<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Arcade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>RETRO GRID ARCADE</h1>

    <p class="instructions">
        PLAYER ONE - DASHBOARD ONLINE
    </p>
    <div class="dashboard">

        <div class="panal score">
            <h2>SCORE</h2>
            <p>12,450</p>
        </div>

        <div class="panal health">
            <h2>HEALTH</h2>
            <p>100%</p>
        </div>

        <div class="panal time">
            <h2>TIME</h2>
            <p>12:45</p>
        </div>
        <div class="panal boss health">
            <h2>BOSS HEALTH</h2>
            <p>24%</p>
        </div>
        
        <div class="panal game-screen">
            <h2>GAME SCREEN</h2>
            <p>LEVEL 03</p>
        </div>

        <div class="panal player">
            <h2>PLAYER</h2>
            <p>PLAYER ONE</p>
        </div>

        <div class="panal mission">
            <h2>MISSION</h2>
            <p>Reach the final sector.</p>
        </div>

        <div class="panal inventory">
            <h2>INVENTORY</h2>
            <p>Shield</p>
            <p>Key</p>
            <p>Energy Cell</p>
        </div>

        <div class="panel power">
            <h2>POWER</h2>
            <p>87%</p>
        </div>
        
        <div class="panel controls">
            <h2>CONTROLS</h2>
            <p>MOVE · FIRE · JUMP</p>
        </div>
        <div class="panel bonus">
            <h2>BONUS</h2>
            <p>2X MULTIPLIER</p>
        </div>
</body>
</html>
