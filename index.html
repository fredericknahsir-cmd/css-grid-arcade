<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Arcade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>RETRO GRID ARCADE</h1>

    <p class="instructions">
        PLAYER ONE - DASHBOARD ONLINE
    </p>
    <div class="dashboard">

        <div class="panal score">
            <h2>SCORE</h2>
            <p>12,450</p>
        </div>

        <div class="bonus-actions">
            <button>CLAIM</button>
            <button>SAVE</button>
            <button>SKIP</button>
        </div>

        <div class="panal health">
            <h2>HEALTH</h2>
            <p>100%</p>
        </div>

        <div class="panal time">
            <h2>TIME</h2>
            <p>12:45</p>
        </div>
        <div class="panal boss health">
            <h2>BOSS HEALTH</h2>
            <p>24%</p>
        </div>
        
        <div class="panal game-screen">
            <h2>GAME SCREEN</h2>
            <p>LEVEL 03</p>
        </div>

        <div class="panal player">
            <h2>PLAYER</h2>
            
            <div class="player-stats">
                <div>
                    <strong>NAME</strong>
                    <span>PLAYER ONE</span>
                </div>
                <div>
                    <strong>LEVEL</strong>
                    <span>03</span>
                </div>
                <div>
                    <strong>LIVES</strong>
                    <span>3</span>
                </div>
            </div>
        </div>

        <div class="panal mission">
            <h2>MISSION</h2>
            <p>Reach the final sector.</p>
        </div>

        <div class="panal inventory">
            <h2>INVENTORY</h2>
            
            <div class="inventory-items">
                <span>SHIELD</span>
                <span>KEY</span>
                <span>ENERGY CELL</span>
                <span>MAP</span>
                <span>BOOST</span>
            </div>
        </div>

        <div class="panel power">
            <h2>POWER</h2>
            <p>87%</p>
        </div>
        
        <div class="panel controls">
            <h2>CONTROLS</h2>
           
            <div class="control-buttons">
                <button>MOVE</button>
                <button>FIRE</button>
                <button>JUMP</button>
            </div>
        </div>
        <div class="panel bonus">
            <h2>BONUS</h2>
            <p>2X MULTIPLIER</p>
        </div>
</body>
</html>
